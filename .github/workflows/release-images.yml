name: Release immutable images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable v-prefixed git tag
        required: true
        type: string
      minimum_migration:
        description: Oldest compatible schema (for example 021_api_trust_expand)
        required: true
        type: string
      maximum_migration:
        description: Newest compatible schema
        required: true
        type: string
      previous_manifest_sha256:
        description: Canonical previous release manifest SHA-256, or none for the first release
        required: true
        type: string
      previous_release_tag:
        description: Immediately previous signed release tag, or none for the first release
        required: true
        type: string

permissions: {}

concurrency:
  group: release-images-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  policy:
    name: Validate release control plane
    runs-on: [self-hosted, linux, x64, saydin-release]
    permissions:
      actions: read
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - name: Fail-closed static and mutation gates
        shell: bash
        env:
          RELEASE_TAG: "${{ inputs.release_tag }}"
          SAYDIN_REQUIRE_DOCKER_SMOKES: "1"
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/release-images.yml@refs/heads/main"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n1 "$RELEASE_TAG")"
          test -z "$(git status --porcelain)"
          python3 infrastructure/release/validate-release.py
          python3 .github/scripts/test-verify-release-ci-admission.py
          python3 infrastructure/release/tests/release-manifest-self-test.py
          python3 infrastructure/backup/tests/backup-static-self-test.py
          infrastructure/deployment/validate-production.sh \
            "$GITHUB_WORKSPACE/infrastructure/deployment/tests/production.validation.env"
          sh -n infrastructure/release/*.sh infrastructure/backup/*.sh
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -ignore 'label "saydin-(release|staging|production|restore)" is unknown' \
            .github/workflows/release-images.yml .github/workflows/deploy-staging.yml \
            .github/workflows/promote-production.yml .github/workflows/rollback-production.yml \
            .github/workflows/restore-drill.yml
          docker run --rm -v "$GITHUB_WORKSPACE:/mnt:ro" \
            koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            /mnt/infrastructure/release/deploy-release.sh \
            /mnt/infrastructure/release/rollback-release.sh \
            /mnt/infrastructure/release/verify-signed-release.sh \
            /mnt/infrastructure/backup/backup-entrypoint.sh \
            /mnt/infrastructure/backup/prepare-recovery.sh \
            /mnt/infrastructure/backup/restore-drill.sh
          docker run --rm -v "$GITHUB_WORKSPACE/infrastructure/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus@sha256:565ee86501224ebbb98fc10b332fa54440b100469924003359edf49cbce374bd \
            check config /etc/prometheus/prometheus.production.yml
          docker run --rm -v "$GITHUB_WORKSPACE/infrastructure/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus@sha256:565ee86501224ebbb98fc10b332fa54440b100469924003359edf49cbce374bd \
            test rules /etc/prometheus/tests/rules.test.yml
      - name: Exact release commit için required CI kabulünü doğrula
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit_sha=$(git rev-parse HEAD)
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$commit_sha&status=success&per_page=100" \
            > ci-runs.json
          ci_run_id=$(python3 .github/scripts/verify-release-ci-admission.py select \
            --runs ci-runs.json --commit-sha "$commit_sha" --branch main)
          [[ "$ci_run_id" =~ ^[1-9][0-9]*$ ]]
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id/jobs?per_page=100" \
            > ci-jobs.json
          python3 .github/scripts/verify-release-ci-admission.py verify \
            --jobs ci-jobs.json --commit-sha "$commit_sha" --run-id "$ci_run_id"

  build:
    name: Build and attest ${{ matrix.name }}
    runs-on: [self-hosted, linux, x64, saydin-release]
    needs: policy
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - {name: api, image: saydin-api, context: ., dockerfile: src/Saydin.Api/Dockerfile}
          - {name: ingestion, image: saydin-price-ingestion, context: ., dockerfile: src/Saydin.PriceIngestion/Dockerfile}
          - {name: control, image: saydin-database-control, context: ., dockerfile: infrastructure/postgres/Dockerfile.migrator}
          - {name: calendar, image: saydin-calendar, context: ., dockerfile: tools/calendar-data/Dockerfile}
          - {name: data_repair, image: saydin-data-repair, context: ., dockerfile: src/Saydin.DataRepair/Dockerfile}
          - {name: dqa, image: saydin-data-quality-audit, context: ., dockerfile: infrastructure/release/Dockerfile.dqa}
          - {name: backup, image: saydin-database-backup, context: infrastructure/backup, dockerfile: infrastructure/backup/Dockerfile}
          - {name: caddy, image: saydin-caddy, context: ., dockerfile: infrastructure/deployment/Dockerfile.caddy}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - name: Verify immutable release ref
        id: source
        shell: bash
        env: {RELEASE_TAG: "${{ inputs.release_tag }}"}
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/release-images.yml@refs/heads/main"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n1 "$RELEASE_TAG")"
          test -z "$(git status --porcelain)"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with: {platforms: amd64,arm64}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Normalize registry reference
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf 'value=ghcr.io/%s/%s\n' "$owner" '${{ matrix.image }}' >> "$GITHUB_OUTPUT"
      - name: Build once for both production architectures
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ref.outputs.value }}:build-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: mode=max
          sbom: true
          no-cache: true
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.release_tag }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Resolve exact platform digests
        id: platform
        shell: bash
        env:
          IMAGE_REF: ${{ steps.ref.outputs.value }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE_REF@$IMAGE_DIGEST" --raw > index.json
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          index=json.load(open("index.json", encoding="utf-8"))
          found={}
          for item in index.get("manifests", []):
              platform=item.get("platform", {})
              key=(platform.get("os"), platform.get("architecture"))
              if key in (("linux","amd64"),("linux","arm64")):
                  if key in found: raise SystemExit("duplicate_platform_manifest")
                  found[key]=item["digest"]
          if set(found) != {("linux","amd64"),("linux","arm64")}: raise SystemExit("platform_manifest_missing")
          with open(sys.argv[1], "a", encoding="utf-8") as output:
              output.write(f"amd64={found[('linux','amd64')]}\narm64={found[('linux','arm64')]}\n")
          PY
      - name: Sign immutable index and platform digests
        shell: bash
        env:
          IMAGE_REF: ${{ steps.ref.outputs.value }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          AMD64_DIGEST: ${{ steps.platform.outputs.amd64 }}
          ARM64_DIGEST: ${{ steps.platform.outputs.arm64 }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_REF@$IMAGE_DIGEST"
          cosign sign --yes "$IMAGE_REF@$AMD64_DIGEST"
          cosign sign --yes "$IMAGE_REF@$ARM64_DIGEST"
      - name: Generate amd64 SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        env: {SYFT_PLATFORM: linux/amd64}
        with:
          image: ${{ steps.ref.outputs.value }}@${{ steps.platform.outputs.amd64 }}
          format: spdx-json
          output-file: sbom.amd64.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
      - name: Generate amd64 CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        env: {SYFT_PLATFORM: linux/amd64}
        with:
          image: ${{ steps.ref.outputs.value }}@${{ steps.platform.outputs.amd64 }}
          format: cyclonedx-json
          output-file: sbom.amd64.cyclonedx.json
          syft-version: v1.51.0
          upload-artifact: false
      - name: Generate arm64 SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        env: {SYFT_PLATFORM: linux/arm64}
        with:
          image: ${{ steps.ref.outputs.value }}@${{ steps.platform.outputs.arm64 }}
          format: spdx-json
          output-file: sbom.arm64.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
      - name: Generate arm64 CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        env: {SYFT_PLATFORM: linux/arm64}
        with:
          image: ${{ steps.ref.outputs.value }}@${{ steps.platform.outputs.arm64 }}
          format: cyclonedx-json
          output-file: sbom.arm64.cyclonedx.json
          syft-version: v1.51.0
          upload-artifact: false
      - name: amd64 vulnerability and license policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env: {TRIVY_PLATFORM: linux/amd64}
        with:
          image-ref: ${{ steps.ref.outputs.value }}@${{ steps.platform.outputs.amd64 }}
          trivy-config: infrastructure/release/trivy.yaml
          scanners: vuln,license
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: false
          format: table
      - name: arm64 vulnerability and license policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env: {TRIVY_PLATFORM: linux/arm64}
        with:
          image-ref: ${{ steps.ref.outputs.value }}@${{ steps.platform.outputs.arm64 }}
          trivy-config: infrastructure/release/trivy.yaml
          scanners: vuln,license
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: false
          format: table
      - name: Publish signed provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ steps.ref.outputs.value }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest SBOMs and create image record
        shell: bash
        env:
          IMAGE_REF: ${{ steps.ref.outputs.value }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          AMD64_DIGEST: ${{ steps.platform.outputs.amd64 }}
          ARM64_DIGEST: ${{ steps.platform.outputs.arm64 }}
        run: |
          set -euo pipefail
          cosign attest --yes --type spdxjson --predicate sbom.amd64.spdx.json "$IMAGE_REF@$AMD64_DIGEST"
          cosign attest --yes --type cyclonedx --predicate sbom.amd64.cyclonedx.json "$IMAGE_REF@$AMD64_DIGEST"
          cosign attest --yes --type spdxjson --predicate sbom.arm64.spdx.json "$IMAGE_REF@$ARM64_DIGEST"
          cosign attest --yes --type cyclonedx --predicate sbom.arm64.cyclonedx.json "$IMAGE_REF@$ARM64_DIGEST"
          mkdir -p record
          python3 infrastructure/release/make_image_record.py \
            --name '${{ matrix.name }}' --source-commit '${{ steps.source.outputs.commit }}' \
            --reference "$IMAGE_REF" --digest "$IMAGE_DIGEST" \
            --amd64-digest "$AMD64_DIGEST" --arm64-digest "$ARM64_DIGEST" \
            --amd64-spdx sbom.amd64.spdx.json --amd64-cyclonedx sbom.amd64.cyclonedx.json \
            --arm64-spdx sbom.arm64.spdx.json --arm64-cyclonedx sbom.arm64.cyclonedx.json \
            --output record/${{ matrix.name }}.json
          cp sbom.amd64.spdx.json record/${{ matrix.name }}.amd64.spdx.json
          cp sbom.amd64.cyclonedx.json record/${{ matrix.name }}.amd64.cyclonedx.json
          cp sbom.arm64.spdx.json record/${{ matrix.name }}.arm64.spdx.json
          cp sbom.arm64.cyclonedx.json record/${{ matrix.name }}.arm64.cyclonedx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-image-${{ matrix.name }}
          path: record/
          if-no-files-found: error
          retention-days: 90

  manifest:
    name: Seal release manifest
    needs: build
    timeout-minutes: 60
    runs-on: [self-hosted, linux, x64, saydin-release]
    permissions:
      contents: write
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-image-*
          path: release/records
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true
      - name: Create canonical manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_IMAGE_LOCK: ${{ vars.SAYDIN_RUNTIME_IMAGE_LOCK_FILE }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PREVIOUS_RELEASE_TAG: ${{ inputs.previous_release_tag }}
          PREVIOUS_MANIFEST_SHA256: ${{ inputs.previous_manifest_sha256 }}
          MINIMUM_MIGRATION: ${{ inputs.minimum_migration }}
          MAXIMUM_MIGRATION: ${{ inputs.maximum_migration }}
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/release-images.yml@refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          [[ "$MINIMUM_MIGRATION" =~ ^[0-9]{3}_[a-z0-9_]+$ ]]
          [[ "$MAXIMUM_MIGRATION" =~ ^[0-9]{3}_[a-z0-9_]+$ ]]
          if test "$PREVIOUS_RELEASE_TAG" != none; then
            [[ "$PREVIOUS_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
            [[ "$PREVIOUS_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          fi
          case "$RUNTIME_IMAGE_LOCK" in /*) ;; *) echo runtime_image_lock_absolute_required >&2; exit 78 ;; esac
          test -f "$RUNTIME_IMAGE_LOCK"
          python3 - "$RUNTIME_IMAGE_LOCK" > release/runtime-images.txt <<'PY'
          import json, re, sys
          value=json.load(open(sys.argv[1], encoding="utf-8"))
          names={"alertmanager","blackbox","loki","nodeExporter","otel","postgresExporter","prometheus","redis","redisExporter","tempo","timescale"}
          pattern=re.compile(r"^[a-z0-9.-]+(?:/[a-z0-9_.-]+)+@sha256:[0-9a-f]{64}$")
          if set(value) != names or any(not isinstance(item,str) or not pattern.fullmatch(item) for item in value.values()):
              raise SystemExit("runtime_image_lock_invalid")
          print("\n".join(value[name] for name in sorted(value)))
          PY
          while IFS= read -r runtime_image; do
            trivy image --config infrastructure/release/trivy.yaml "$runtime_image"
          done < release/runtime-images.txt
          commit_sha=$(git rev-parse HEAD)
          terminal=$(find infrastructure/postgres/migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9]_*.sql' -print \
            | LC_ALL=C sort | tail -n1 | sed -E 's#^.*/([0-9]{3}_[a-z0-9_]+)\.sql$#\1#')
          trust_sha=$(sha256sum src/Saydin.DatabaseMigrator/MigrationTrustRoot.cs | cut -d' ' -f1)
          if test "$PREVIOUS_RELEASE_TAG" = none; then
            test "$PREVIOUS_MANIFEST_SHA256" = none
            test "$(gh release list --limit 1 --json tagName --jq length)" = 0
          else
            test "$PREVIOUS_RELEASE_TAG" != "$RELEASE_TAG"
            install -d -m 0700 "$RUNNER_TEMP/previous-release"
            gh release download "$PREVIOUS_RELEASE_TAG" --dir "$RUNNER_TEMP/previous-release" \
              --pattern release-manifest.json --pattern release-manifest.sig --pattern release-manifest.pem
            cosign verify-blob --certificate "$RUNNER_TEMP/previous-release/release-manifest.pem" \
              --signature "$RUNNER_TEMP/previous-release/release-manifest.sig" \
              --certificate-identity-regexp '^https://github.com/${{ github.repository }}/.github/workflows/release-images\.yml@refs/heads/main$' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$RUNNER_TEMP/previous-release/release-manifest.json" >/dev/null
            python3 infrastructure/release/release_manifest.py verify \
              --manifest "$RUNNER_TEMP/previous-release/release-manifest.json" >/dev/null
            python3 - "$RUNNER_TEMP/previous-release/release-manifest.json" "$PREVIOUS_RELEASE_TAG" "$GITHUB_REPOSITORY" <<'PY'
          import json, sys
          value=json.load(open(sys.argv[1],encoding="utf-8"))
          if value["releaseId"]!=sys.argv[2] or value["source"]["repository"].lower()!=sys.argv[3].lower(): raise SystemExit(1)
          PY
            test "$(sha256sum "$RUNNER_TEMP/previous-release/release-manifest.json" | cut -d' ' -f1)" = "$PREVIOUS_MANIFEST_SHA256"
          fi
          python3 infrastructure/release/release_manifest.py create \
            --records release/records --runtime-images "$RUNTIME_IMAGE_LOCK" --release-id "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" --commit-sha "$commit_sha" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" --terminal-migration "$terminal" \
            --trust-root-sha256 "$trust_sha" \
            --minimum-migration "$MINIMUM_MIGRATION" \
            --maximum-migration "$MAXIMUM_MIGRATION" \
            --previous-manifest-sha256 "$PREVIOUS_MANIFEST_SHA256" \
            --output release/release-manifest.json > release/release-manifest.sha256
          test "$terminal" = "$MAXIMUM_MIGRATION"
          cosign sign-blob --yes --bundle release/release-manifest.bundle.json \
            --output-signature release/release-manifest.sig \
            --output-certificate release/release-manifest.pem \
            release/release-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ inputs.release_tag }}
          path: release/
          if-no-files-found: error
          retention-days: 90
      - name: Publish immutable release evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes 'Immutable Saydin release evidence.'
          gh release upload "$RELEASE_TAG" \
            release/release-manifest.json release/release-manifest.sha256 \
            release/release-manifest.sig release/release-manifest.pem \
            release/release-manifest.bundle.json release/records/*.spdx.json \
            release/records/*.cyclonedx.json
