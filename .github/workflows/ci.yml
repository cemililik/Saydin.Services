name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
    types: [opened, synchronize, reopened]

# Least-privilege: workflow yalnızca repository içeriğini okur ve PR-step-summary'i yazar.
# write-all default'unu override eder.
permissions:
  contents: read

# CFGR-005: Aynı PR'a yapılan push'larda eski run iptal edilir; main push'larında
# concurrent merge sırası bozulmasın diye iptal yapılmaz.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: .NET SDK kur
        uses: actions/setup-dotnet@v4
        with:
          # F2.9-3 ([C-I-4]): global.json'daki SDK pin'i kullan (10.0.100 +
          # rollForward: latestFeature). Dolayısıyla repo CLI ile birebir aynı SDK.
          global-json-file: global.json
          # F2.9-1 ([C-I-2]) + CFGR-008: NuGet packages cache — restore süresini
          # dakikalarca azaltır. global.json değişikliğinde SDK bump → cache
          # invalidation tetiklensin diye dependency path listesine eklendi.
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
            global.json

      - name: Bağımlılıkları yükle
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Testleri çalıştır (coverage ile)
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      # CFGR-013: Cobertura artefakt'ını upload — coverage trendini PR-arası
      # karşılaştırılabilir kılar (Codecov / Coveralls'a feed edilebilir).
      - name: Coverage artefakt yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '**/coverage.cobertura.xml'
          retention-days: 14

      - name: Coverage özeti
        if: always()
        run: |
          # Birden fazla test projesi var (Api.Tests, PriceIngestion.Tests).
          # head -1 yerine tümünü dolaş; her dosya için per-project satır + bir basit aggregate.
          mapfile -t COV_FILES < <(find . -name "coverage.cobertura.xml" -path "*/TestResults/*")
          if [ "${#COV_FILES[@]}" -eq 0 ]; then
            echo "⚠️ Coverage dosyası bulunamadı" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "## 🧪 Saydin.Services — Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Project | Line | Branch |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|--------|" >> $GITHUB_STEP_SUMMARY

          LINE_SUM=0
          BRANCH_SUM=0
          COUNT=${#COV_FILES[@]}

          for COV in "${COV_FILES[@]}"; do
            LINE_RATE=$(grep -oP 'line-rate="\K[^"]+' "$COV" | head -1)
            BRANCH_RATE=$(grep -oP 'branch-rate="\K[^"]+' "$COV" | head -1)

            # Bozuk/eksik Cobertura raporlarına karşı koruma — bc boş input
            # alırsa hata fırlatıp tüm step'i FAIL ettirir.
            [[ "$LINE_RATE"   =~ ^[0-9.]+$ ]] || LINE_RATE=0
            [[ "$BRANCH_RATE" =~ ^[0-9.]+$ ]] || BRANCH_RATE=0

            LINE_PCT=$(echo "$LINE_RATE * 100" | bc -l | xargs printf "%.1f")
            BRANCH_PCT=$(echo "$BRANCH_RATE * 100" | bc -l | xargs printf "%.1f")
            # Path'ten proje adını çıkar: ./tests/Saydin.Api.Tests/TestResults/<guid>/coverage.cobertura.xml
            PROJECT=$(echo "$COV" | awk -F/ '{print $3}')

            echo "| $PROJECT | ${LINE_PCT}% | ${BRANCH_PCT}% |" >> $GITHUB_STEP_SUMMARY

            LINE_SUM=$(echo "$LINE_SUM + $LINE_PCT" | bc -l)
            BRANCH_SUM=$(echo "$BRANCH_SUM + $BRANCH_PCT" | bc -l)
          done

          if [ "$COUNT" -gt 0 ]; then
            LINE_AVG=$(echo "$LINE_SUM / $COUNT" | bc -l | xargs printf "%.1f")
            BRANCH_AVG=$(echo "$BRANCH_SUM / $COUNT" | bc -l | xargs printf "%.1f")
            echo "| **Average** | **${LINE_AVG}%** | **${BRANCH_AVG}%** |" >> $GITHUB_STEP_SUMMARY
            echo "✅ Line avg: ${LINE_AVG}% | Branch avg: ${BRANCH_AVG}% (across $COUNT projects)"
          fi

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # F2.9-2 ([C-I-3]): Docker layer cache. BuildKit + GitHub Actions cache backend
      # (`type=gha`) ile sonraki run'lar `dotnet restore` ve `RUN` katmanlarını
      # yeniden kullanır. Soğuk build ~2dk → cache hit'te ~10sn.
      - name: Docker Buildx kur
        uses: docker/setup-buildx-action@v3

      # CFGR-002: Fork PR cache poisoning'i engelle. Cache **yazma** sadece
      # internal push'larda (main / development) yapılır; fork PR'lar cache'i
      # read-only kullanır. Aksi halde malicious fork main scope'unu poison'layabilirdi.
      - name: Cache write target belirle
        id: cache_target
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "api=type=gha,scope=saydin-api,mode=max" >> $GITHUB_OUTPUT
            echo "ing=type=gha,scope=saydin-price-ingestion,mode=max" >> $GITHUB_OUTPUT
          else
            echo "api=" >> $GITHUB_OUTPUT
            echo "ing=" >> $GITHUB_OUTPUT
          fi

      - name: Saydin.Api Docker image build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Saydin.Api/Dockerfile
          tags: saydin-api:ci
          push: false
          load: true
          cache-from: type=gha,scope=saydin-api
          cache-to: ${{ steps.cache_target.outputs.api }}

      - name: Saydin.PriceIngestion Docker image build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Saydin.PriceIngestion/Dockerfile
          tags: saydin-price-ingestion:ci
          push: false
          load: true
          cache-from: type=gha,scope=saydin-price-ingestion
          cache-to: ${{ steps.cache_target.outputs.ing }}
