name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
    types: [opened, synchronize, reopened]

# Least-privilege: workflow yalnızca repository içeriğini okur ve PR-step-summary'i yazar.
# write-all default'unu override eder.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud blame analizi için tam history gerekiyor.
          fetch-depth: 0

      - name: .NET SDK kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Java kur (SonarCloud scanner için zorunlu)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SonarCloud cache
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-cache-${{ runner.os }}
          restore-keys: sonar-cache-${{ runner.os }}

      - name: dotnet-sonarscanner kur
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Bağımlılıkları yükle
        run: dotnet restore

      - name: SonarCloud analizi başlat
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # github.head_ref / base_ref / ref_name PR fork'tan geldiğinde user-controlled
          # olabiliyor — doğrudan run: bloğunda interpolation script injection açar
          # (githubactions:S7630). Env var'a alıp shell quoting ile geçiriyoruz.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # PR build'lerinde sonar.pullrequest.* parametreleri SonarCloud'a hangi PR olduğunu söyler.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            dotnet sonarscanner begin \
              /k:"cemililik_Saydin.Services" \
              /o:"cemililik" \
              /d:sonar.token="$SONAR_TOKEN" \
              /d:sonar.host.url="https://sonarcloud.io" \
              /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
              /d:sonar.cs.vscoveragexml.reportsPaths="**/coverage.cobertura.xml" \
              /d:sonar.exclusions="infrastructure/postgres/migrations/**/*.sql" \
              /d:sonar.pullrequest.key="$PR_NUMBER" \
              /d:sonar.pullrequest.branch="$HEAD_REF" \
              /d:sonar.pullrequest.base="$BASE_REF"
          else
            dotnet sonarscanner begin \
              /k:"cemililik_Saydin.Services" \
              /o:"cemililik" \
              /d:sonar.token="$SONAR_TOKEN" \
              /d:sonar.host.url="https://sonarcloud.io" \
              /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
              /d:sonar.cs.vscoveragexml.reportsPaths="**/coverage.cobertura.xml" \
              /d:sonar.exclusions="infrastructure/postgres/migrations/**/*.sql" \
              /d:sonar.branch.name="$REF_NAME"
          fi

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Testleri çalıştır (coverage ile)
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: SonarCloud analizi bitir
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Coverage özeti
        if: always()
        run: |
          # Birden fazla test projesi var (Api.Tests, PriceIngestion.Tests).
          # head -1 yerine tümünü dolaş; her dosya için per-project satır + bir basit aggregate.
          mapfile -t COV_FILES < <(find . -name "coverage.cobertura.xml" -path "*/TestResults/*")
          if [ "${#COV_FILES[@]}" -eq 0 ]; then
            echo "⚠️ Coverage dosyası bulunamadı" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "## 🧪 Saydin.Services — Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Project | Line | Branch |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|--------|" >> $GITHUB_STEP_SUMMARY

          LINE_SUM=0
          BRANCH_SUM=0
          COUNT=${#COV_FILES[@]}

          for COV in "${COV_FILES[@]}"; do
            LINE_RATE=$(grep -oP 'line-rate="\K[^"]+' "$COV" | head -1)
            BRANCH_RATE=$(grep -oP 'branch-rate="\K[^"]+' "$COV" | head -1)

            LINE_PCT=$(echo "$LINE_RATE * 100" | bc -l | xargs printf "%.1f")
            BRANCH_PCT=$(echo "$BRANCH_RATE * 100" | bc -l | xargs printf "%.1f")
            # Path'ten proje adını çıkar: ./tests/Saydin.Api.Tests/TestResults/<guid>/coverage.cobertura.xml
            PROJECT=$(echo "$COV" | awk -F/ '{print $3}')

            echo "| $PROJECT | ${LINE_PCT}% | ${BRANCH_PCT}% |" >> $GITHUB_STEP_SUMMARY

            LINE_SUM=$(echo "$LINE_SUM + $LINE_PCT" | bc -l)
            BRANCH_SUM=$(echo "$BRANCH_SUM + $BRANCH_PCT" | bc -l)
          done

          if [ "$COUNT" -gt 0 ]; then
            LINE_AVG=$(echo "$LINE_SUM / $COUNT" | bc -l | xargs printf "%.1f")
            BRANCH_AVG=$(echo "$BRANCH_SUM / $COUNT" | bc -l | xargs printf "%.1f")
            echo "| **Average** | **${LINE_AVG}%** | **${BRANCH_AVG}%** |" >> $GITHUB_STEP_SUMMARY
            echo "✅ Line avg: ${LINE_AVG}% | Branch avg: ${BRANCH_AVG}% (across $COUNT projects)"
          fi

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Saydin.Api Docker image build
        run: docker build -f src/Saydin.Api/Dockerfile -t saydin-api:ci .

      - name: Saydin.PriceIngestion Docker image build
        run: docker build -f src/Saydin.PriceIngestion/Dockerfile -t saydin-price-ingestion:ci .
