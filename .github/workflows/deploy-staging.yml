name: Deploy signed release to staging

on:
  workflow_dispatch:
    inputs:
      release_tag: {description: Signed release tag, required: true, type: string}

permissions: {}
concurrency: {group: saydin-staging, cancel-in-progress: false}

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, saydin-staging]
    environment: staging
    timeout-minutes: 120
    permissions:
      contents: write
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify release evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/deploy-staging.yml@refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          release_commit=$(git rev-list -n1 "$RELEASE_TAG")
          release_dir="$RUNNER_TEMP/saydin-release"
          test ! -e "$release_dir"
          install -d -m 0700 "$release_dir"
          gh release download "$RELEASE_TAG" --dir "$release_dir"
          infrastructure/release/verify-signed-release.sh "$release_dir" \
            '^https://github.com/${{ github.repository }}/.github/workflows/release-images\.yml@refs/heads/main$' \
            'https://token.actions.githubusercontent.com' '${{ github.repository }}' \
            "$RELEASE_TAG" "$release_commit"
      - name: Render digest-only deployment environment
        shell: bash
        env:
          OPERATOR_ENV_FILE: ${{ vars.SAYDIN_STAGING_ENV_FILE }}
        run: |
          set -euo pipefail
          case "$OPERATOR_ENV_FILE" in /*) ;; *) exit 78 ;; esac
          python3 infrastructure/release/render-deployment-env.py \
            --base "$OPERATOR_ENV_FILE" \
            --manifest "$RUNNER_TEMP/saydin-release/release-manifest.json" \
            --output "$RUNNER_TEMP/saydin-staging.env"
      - name: Ordered staging gate
        shell: bash
        env:
          SAYDIN_ENABLE_BACKUP: ${{ vars.SAYDIN_ENABLE_BACKUP }}
          SAYDIN_ENABLE_INGESTION: ${{ vars.SAYDIN_ENABLE_INGESTION }}
          SAYDIN_PUBLIC_SMOKE_CONFIG_FILE: ${{ vars.SAYDIN_STAGING_SMOKE_CONFIG_FILE }}
        run: |
          set -euo pipefail
          infrastructure/release/deploy-release.sh staging saydin-staging \
            "$GITHUB_WORKSPACE/infrastructure/deployment/compose.production.yml" \
            "$RUNNER_TEMP/saydin-staging.env" "$RUNNER_TEMP/saydin-release" \
            "$RUNNER_TEMP/staging-receipt" '${{ github.run_id }}'
      - name: Sign and publish staging receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature "$RUNNER_TEMP/staging-receipt/staging-receipt-${{ github.run_id }}.sig" \
            --output-certificate "$RUNNER_TEMP/staging-receipt/staging-receipt-${{ github.run_id }}.pem" \
            "$RUNNER_TEMP/staging-receipt/receipt.json"
          cp "$RUNNER_TEMP/staging-receipt/receipt.json" \
            "$RUNNER_TEMP/staging-receipt/staging-receipt-${{ github.run_id }}.json"
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/staging-receipt/staging-receipt-${{ github.run_id }}.json" \
            "$RUNNER_TEMP/staging-receipt/staging-receipt-${{ github.run_id }}.sig" \
            "$RUNNER_TEMP/staging-receipt/staging-receipt-${{ github.run_id }}.pem"
