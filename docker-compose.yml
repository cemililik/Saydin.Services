services:

  # ============================================================
  # VERİTABANI
  # ============================================================

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: saydin-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saydin}
      POSTGRES_USER: ${POSTGRES_USER:-saydin}
      # F1.7-1: Default 'changeme' fallback'i kaldırıldı — env zorunlu (compose fail-fast).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # initdb.d: yalnızca ilk başlatmada (volume boşken) klasör tamamı alfabetik
      # sırayla yürütülür. Yeni migration eklendiğinde ek mount gerekmez.
      - ./infrastructure/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # POSTGRES_USER / POSTGRES_DB parametrik olduğu için healthcheck de aynı env ile çalışır
      # (env yokluğunda compose substitution boş string verir; pg_isready Postgres'in default
      # user/db'sine düşer — Postgres image'i POSTGRES_USER yokken postgres/postgres kullanır).
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-saydin}\" -d \"$${POSTGRES_DB:-saydin}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: saydin-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@saydin.dev}
      # Default şifre kaldırıldı — deploy zamanı PGADMIN_PASSWORD env ile zorunlu sağlanmalı.
      # Şifre verilmezse compose UI başlangıcı başarısız olur (fail fast > insecure default).
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infrastructure/pgadmin/servers.json:/pgadmin4/servers.json:ro
      # F1.6-3: servers.json `PassFile: /tmp/pgpassfile` referansını çözer.
      # Gerçek dosya .gitignored — geliştirici bir kerelik setup:
      #   cp infrastructure/pgadmin/pgpassfile.sample infrastructure/pgadmin/pgpassfile
      #   chmod 600 infrastructure/pgadmin/pgpassfile  # libpq passfile şart koşar
      # Dosya yoksa pgAdmin auto-connect başarısız olur (UI'dan manuel girilir),
      # geri kalan stack etkilenmez. Mount uyarısı: dosya olmadan compose up dizin
      # yaratır — sample'ı kopyalamak unutulmamalı.
      - ./infrastructure/pgadmin/pgpassfile:/tmp/pgpassfile:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # CACHE
  # ============================================================

  redis:
    image: redis:alpine
    container_name: saydin-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-insight:
    image: redis/redisinsight:latest
    container_name: saydin-redis-insight
    ports:
      - "5540:5540"
    volumes:
      - redis_insight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # OBSERVABİLİTY — Loglar + Trace + Metrik
  # ============================================================

  # Aspire Dashboard: tek arayüzde log, trace ve metrik görüntüleme.
  # OTLP endpoint: localhost:4317 (gRPC)
  # Dashboard UI:  http://localhost:18888
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: saydin-aspire-dashboard
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      - "18888:18888"   # Dashboard UI
      - "4317:18889"    # OTLP/gRPC → .NET servisler buraya export eder
    restart: unless-stopped

  # Prometheus: metrik kazıma ve saklama.
  # UI: http://localhost:9090
  prometheus:
    image: prom/prometheus:latest
    container_name: saydin-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  # ============================================================
  # BACKEND SERVİSLER
  # ============================================================

  saydin-api:
    build:
      context: .
      dockerfile: src/Saydin.Api/Dockerfile
    container_name: saydin-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Database=${POSTGRES_DB:-saydin};Username=${POSTGRES_USER:-saydin};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      ConnectionStrings__Redis: "redis:6379"
      Otlp__Endpoint: "http://aspire-dashboard:18889"
      GeoIp__DatabasePath: "/app/geoip/GeoLite2-City.mmdb"
    ports:
      - "5080:8080"
    volumes:
      - ./infrastructure/geoip:/app/geoip:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # F1.7-6: Compose-level liveness — Dockerfile HEALTHCHECK ile aynı endpoint'i kullanır.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  saydin-price-ingestion:
    build:
      context: .
      dockerfile: src/Saydin.PriceIngestion/Dockerfile
    container_name: saydin-price-ingestion
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=${POSTGRES_DB:-saydin};Username=${POSTGRES_USER:-saydin};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      Otlp__Endpoint: "http://aspire-dashboard:18889"
      ExternalApis__CoinGecko__ApiKey: ${COINGECKO_API_KEY:-}
      ExternalApis__OpenExchangeRates__AppId: ${OPENEXCHANGERATES_APP_ID:-}
      ExternalApis__TwelveData__ApiKey: ${TWELVEDATA_API_KEY:-}
      ExternalApis__Evds__ApiKey: ${EVDS_API_KEY:-}
      # ── Seçici Worker Kontrolü ──────────────────────────────────────────────
      # Varsayılan: tüm worker'lar aktif. Kapatmak için "false" yap.
      IngestionWorkers__Tcmb__Enabled: "true"
      IngestionWorkers__CoinGecko__Enabled: "false"
      IngestionWorkers__OpenExchangeRates__Enabled: "false"
      IngestionWorkers__TwelveData__Enabled: "false"
      IngestionWorkers__EvdsInflation__Enabled: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # F1.7-6: LivenessHeartbeatService /tmp/saydin-ingestion-healthy dosyasını
      # her 30 saniyede touch eder. Dosyanın son 2 dakika içinde dokunulduğunu doğrula.
      test:
        - "CMD-SHELL"
        - "test -f /tmp/saydin-ingestion-healthy && find /tmp/saydin-ingestion-healthy -mmin -2 -print -quit | grep -q . || exit 1"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  redis_insight_data:
  prometheus_data:
