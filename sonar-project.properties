sonar.projectKey=cemililik_Saydin.Services
sonar.organization=cemililik

# PostgreSQL migration dosyaları Sonar'ın PL/SQL (Oracle dialect) analyzer'ı tarafından
# yanlış değerlendiriliyor — örn. CHAR(2) (ISO ülke kodu) için "VARCHAR2 kullan" bug'ı
# tetikliyor; VARCHAR2 Oracle'a özgüdür, PostgreSQL'de yoktur. Migration'lar zaten
# CLAUDE.md kuralı gereği değiştirilmez. Bu yüzden tüm migration SQL dosyaları
# analiz dışı bırakılıyor.
sonar.exclusions=infrastructure/postgres/migrations/**/*.sql

# Test coverage: opencover/cobertura raporu CI tarafından üretilir
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vscoveragexml.reportsPaths=**/coverage.cobertura.xml
