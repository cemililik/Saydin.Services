# SonarQube Cloud (Automatic Analysis) scope for Saydın Services.
#
# tools/calendar-data/data/**
#   Byte-for-byte captured third-party calendar pages plus their JSON manifests.
#   Every file is pinned by SHA-256 and re-verified offline by tools/calendar-data —
#   editing one to satisfy a lint rule would break the trust chain it exists to prove.
#   These are evidence artefacts, not source. Analysing them produced ~1.9k findings
#   (HTML accessibility rules on archived markup) and every duplicated line reported
#   as "duplication on new code".
#
# infrastructure/postgres/migrations/**
#   Immutable, sequentially numbered PostgreSQL/TimescaleDB migrations. A migration
#   that has ever been applied is never edited (see CLAUDE.md § Veritabanı Kuralları),
#   so PL/SQL findings inside them are structurally unactionable. .codacy.yaml and
#   .coderabbit.yaml already exclude the same path for the same reason.
sonar.exclusions=tools/calendar-data/data/**,infrastructure/postgres/migrations/**
