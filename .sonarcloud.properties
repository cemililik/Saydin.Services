# SonarQube Cloud (Automatic Analysis) scope for Saydın Services.
#
# tools/calendar-data/data/**
#   Byte-for-byte captured third-party calendar pages plus their JSON manifests.
#   Every file is pinned by SHA-256 and re-verified offline by tools/calendar-data —
#   editing one to satisfy a lint rule would break the trust chain it exists to prove.
#   These are evidence artefacts, not source. Analysing them produced ~1.9k findings
#   (HTML accessibility rules on archived markup) and every duplicated line reported
#   as "duplication on new code".
#
# infrastructure/postgres/migrations/**
#   Immutable, sequentially numbered PostgreSQL/TimescaleDB migrations. A migration
#   that has ever been applied is never edited (see CLAUDE.md § Veritabanı Kuralları),
#   so PL/SQL findings inside them are structurally unactionable. .codacy.yaml and
#   .coderabbit.yaml already exclude the same path for the same reason.
sonar.exclusions=tools/calendar-data/data/**,infrastructure/postgres/migrations/**

# Gerekçelendirilmiş kural istisnaları. Her biri belirli bir dosyaya bağlıdır ve
# kararın tam gerekçesi docs/analysis/pr-review2/09-ci-gate-remediation.md §3.3'tedir.
# (Aynı yerlerde satır içi NOSONAR de bulunur; bu blok analiz yöntemi değişse bile
# kararın repo içinde denetlenebilir kalmasını sağlar.)
sonar.issue.ignore.multicriteria=heartbeatPath,migrationDigest,scramInterop

# python:S5443 — "/tmp/saydin-ingestion-" bu script'in açtığı bir dizin değil;
# docker-compose.yml'e karşı doğrulanan, container'ın sahip olduğu sözleşme değeridir.
sonar.issue.ignore.multicriteria.heartbeatPath.ruleKey=python:S5443
sonar.issue.ignore.multicriteria.heartbeatPath.resourceKey=.github/scripts/validate-development-compose.py

# csharpsquid:S6418 — sabitler migration dosyalarının SHA-256 içerik digest'idir;
# sır değil, migration drift'ini tespit edilebilir kılan bütünlük çıpasıdır.
sonar.issue.ignore.multicriteria.migrationDigest.ruleKey=csharpsquid:S6418
sonar.issue.ignore.multicriteria.migrationDigest.resourceKey=src/Saydin.DataQualityAudit/EmbeddedMigrations.cs

# csharpsquid:S5344 — 4096, PostgreSQL'in kendi scram_iterations varsayılanıdır.
# Bu bir password-at-rest KDF'i değil, sunucunun aynı sayıyla yeniden ürettiği bir
# authentication verifier'dır; sayıyı değiştirmek interop'u bozar.
sonar.issue.ignore.multicriteria.scramInterop.ruleKey=csharpsquid:S5344
sonar.issue.ignore.multicriteria.scramInterop.resourceKey=src/Saydin.DatabaseSecurity/PostgresScramSha256Verifier.cs
