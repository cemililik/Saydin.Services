groups:
  - name: saydin-database
    rules:
      - alert: SaydinPostgresExporterUnavailable
        expr: up{job="postgres"} != 1
        for: 2m
        labels: {severity: critical, service: postgres}
        annotations:
          summary: PostgreSQL exporter scrape is unavailable
          runbook_url: https://github.com/cemililik/Saydin.Services/blob/main/docs/runbooks/database-saturation.md

      - alert: SaydinPostgresUnavailable
        expr: pg_up{job="postgres"} != 1
        for: 2m
        labels: {severity: critical, service: postgres}
        annotations:
          summary: PostgreSQL exporter cannot reach PostgreSQL
          runbook_url: https://github.com/cemililik/Saydin.Services/blob/main/docs/runbooks/database-saturation.md

      - alert: SaydinPostgresConnectionsHigh
        expr: sum(pg_stat_activity_count{job="postgres"}) > 80
        for: 10m
        labels: {severity: warning, service: postgres}
        annotations:
          summary: PostgreSQL connection count is above the initial operating budget
          runbook_url: https://github.com/cemililik/Saydin.Services/blob/main/docs/runbooks/database-saturation.md
