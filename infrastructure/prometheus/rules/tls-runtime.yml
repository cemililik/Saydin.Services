groups:
  - name: telemetry-pipeline
    rules:
      - alert: TelemetryExportFailure
        expr: sum(increase({__name__=~"otelcol_exporter_(enqueue_failed|send_failed)_(spans|log_records)"}[5m])) > 0
        for: 5m
        labels: {severity: warning, service: telemetry}
        annotations:
          summary: Trace or log export is failing
          runbook_url: https://github.com/cemililik/Saydin.Services/blob/main/docs/runbooks/telemetry-pipeline.md
      - alert: TelemetryQueueNearCapacity
        expr: max(otelcol_exporter_queue_size / clamp_min(otelcol_exporter_queue_capacity, 1)) > 0.8
        for: 10m
        labels: {severity: warning, service: telemetry}
        annotations:
          summary: Durable telemetry queue exceeds 80 percent
          runbook_url: https://github.com/cemililik/Saydin.Services/blob/main/docs/runbooks/telemetry-pipeline.md

  - name: saydin-tls-runtime
    rules:
      - alert: SaydinTelemetryCollectorUnavailable
        expr: up{job="otel-collector"} != 1
        for: 5m
        labels: {severity: critical, service: telemetry}
        annotations:
          summary: OpenTelemetry metrics endpoint is unavailable
          runbook_url: https://github.com/cemililik/Saydin.Services/blob/main/docs/runbooks/api-availability.md

      - alert: SaydinAlertmanagerUnavailable
        expr: up{job="alertmanager"} != 1
        for: 5m
        labels: {severity: critical, service: alertmanager}
        annotations:
          summary: Alertmanager scrape is unavailable
          runbook_url: https://github.com/cemililik/Saydin.Services/blob/main/docs/runbooks/api-availability.md

      - alert: SaydinBlackboxSeriesMissing
        expr: absent(probe_success{job="blackbox-https"})
        for: 10m
        labels: {severity: critical, service: edge}
        annotations:
          summary: Public HTTPS probe series is absent
          runbook_url: https://github.com/cemililik/Saydin.Services/blob/main/docs/runbooks/tls-expiry.md

      - alert: SaydinPublicProbeFailed
        expr: probe_success{job="blackbox-https"} != 1
        for: 3m
        labels: {severity: critical, service: edge}
        annotations:
          summary: Public HTTPS probe failed
          runbook_url: https://github.com/cemililik/Saydin.Services/blob/main/docs/runbooks/tls-expiry.md

      - alert: SaydinCertificateExpiring
        expr: probe_ssl_earliest_cert_expiry{job="blackbox-https"} - time() < 1209600
        for: 30m
        labels: {severity: warning, service: edge}
        annotations:
          summary: Public TLS certificate expires within 14 days
          runbook_url: https://github.com/cemililik/Saydin.Services/blob/main/docs/runbooks/tls-expiry.md

      - alert: SaydinProcessRestarted
        expr: changes(process_start_time_seconds{job=~"saydin-api|otel-collector|prometheus|alertmanager"}[15m]) > 0
        labels: {severity: warning, service: runtime}
        annotations:
          summary: A monitored production process restarted
          runbook_url: https://github.com/cemililik/Saydin.Services/blob/main/docs/runbooks/container-restart.md
