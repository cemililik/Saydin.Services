global:
  resolve_timeout: 5m

route:
  receiver: operator-warning
  group_by: [alertname, service, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="watchdog"']
      receiver: external-watchdog
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - matchers: ['severity="critical"']
      receiver: operator-critical
      repeat_interval: 30m
    - matchers: ['severity="warning"']
      receiver: operator-warning

receivers:
  - name: operator-critical
    webhook_configs:
      - url: https://example.invalid/CHANGE_ME_CRITICAL_RECEIVER
        send_resolved: true
  - name: operator-warning
    webhook_configs:
      - url: https://example.invalid/CHANGE_ME_WARNING_RECEIVER
        send_resolved: true
  - name: external-watchdog
    webhook_configs:
      - url: https://example.invalid/CHANGE_ME_WATCHDOG_RECEIVER
        send_resolved: true

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [service]
