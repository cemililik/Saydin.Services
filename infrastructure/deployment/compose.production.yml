  data: {internal: true}
  backup-db:
    internal: true
    ipam:
      config: [{subnet: "${SAYDIN_BACKUP_DATABASE_NETWORK_CIDR:?dedicated backup database CIDR required}"}]
  management: {internal: true}
  provider-egress: {}
  alert-egress: {}
  backup-egress: {}
  kms-egress: {}

volumes:
